# EHMS production stack — HTTPS (Caddy + Let's Encrypt) → EHMS app → PostgreSQL, plus the background worker
# (reminders, reports, verified encrypted backups). The database is on an internal network with no route outside.
#
# Quickest path on a fresh Ubuntu server:   sudo bash deploy/install.sh
# By hand:  cp .env.example .env  (fill every CHANGE-ME)  →  docker compose up -d --build
#           docker compose exec app python -m ehms.preflight
#           docker compose exec app python -m ehms.seed bootstrap --org "..." --org-code ABC --hotel "..." --hotel-code H1 \
#                                   --admin-email you@example.com --admin-name "Your Name"
x-ehms: &ehms
  build: .
  image: ehms:${EHMS_IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://ehms:${POSTGRES_PASSWORD}@db:5432/ehms
    FORWARDED_ALLOW_IPS: 172.30.10.0/24
  volumes:
    - ehms-data:/data            # documents, room/website photos, encrypted backups
  read_only: true
  tmpfs: ["/tmp:size=512m"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  depends_on:
    db:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      EHMS_DOMAIN: ${EHMS_DOMAIN:?set EHMS_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [app]

  app:
    <<: *ehms
    environment:
      DATABASE_URL: postgresql://ehms:${POSTGRES_PASSWORD}@db:5432/ehms
      FORWARDED_ALLOW_IPS: 172.30.10.0/24
      EHMS_WORKER: "0"             # jobs run in the worker service below
    networks:
      edge: { ipv4_address: 172.30.10.10 }
      internal: {}

  worker:
    <<: *ehms
    command: ["python", "-m", "ehms.worker", "--loop"]
    healthcheck: { disable: true }
    depends_on:
      db: { condition: service_healthy }
      app: { condition: service_healthy }   # the app applies database migrations first
    networks: [internal, edge]     # edge = outbound email, SMS and payment-provider calls

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ehms
      POSTGRES_USER: ehms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehms -d ehms"]
      interval: 10s
      retries: 6
    networks: [internal]

networks:
  edge:
    ipam: { config: [{ subnet: 172.30.10.0/24 }] }
  internal:
    internal: true

volumes:
  pgdata:
  ehms-data:
  caddy-data:
  caddy-config:
