name: Android app

# Builds the EHMS Staff Android app (Trusted Web Activity) for the Google Play Store.
#   Actions → "Android app" → Run workflow → enter the hotel's live address and the app name.
# With the four ANDROID_* secrets set (see docs/ANDROID_APP.md) it produces a SIGNED .aab ready to upload to Play
# Console; without them it still builds an unsigned bundle and a debug .apk for testing on a phone.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "Hotel's live address, without https:// (e.g. ehms.myhotel.com)"
        required: true
        default: "hotel.example.com"
      app_name:
        description: "App name shown on the phone and in Play Store"
        required: true
        default: "EHMS Staff"
      application_id:
        description: "Unique package name — never change it after the first Play Store upload"
        required: true
        default: "ng.ehms.staff"
      version_code:
        description: "Version code (whole number, +1 for every upload)"
        required: true
        default: "1"
      version_name:
        description: "Version name shown to users"
        required: true
        default: "1.4.0"
  push:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      HOST: ${{ github.event.inputs.host || 'hotel.example.com' }}
      APP_NAME: ${{ github.event.inputs.app_name || 'EHMS Staff' }}
      APP_ID: ${{ github.event.inputs.application_id || 'ng.ehms.staff' }}
      VCODE: ${{ github.event.inputs.version_code || '1' }}
      VNAME: ${{ github.event.inputs.version_name || '1.4.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK (preinstalled on GitHub's runners)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Decode upload key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "EHMS_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key from secrets"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — building an UNSIGNED bundle (not uploadable) and a debug APK"
          fi
      - name: Build
        env:
          EHMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EHMS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EHMS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pehms.host="$HOST" -Pehms.appName="$APP_NAME" -Pehms.applicationId="$APP_ID" \
            -Pehms.versionCode="$VCODE" -Pehms.versionName="$VNAME" bundleRelease assembleDebug
      - name: Certificate fingerprint for assetlinks.json
        if: env.EHMS_KEYSTORE_FILE != ''
        env:
          EHMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EHMS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore "$EHMS_KEYSTORE_FILE" -storepass "$EHMS_KEYSTORE_PASSWORD" -alias "$EHMS_KEY_ALIAS" | grep "SHA256:" | tee fingerprint.txt
          echo "### Upload key SHA-256: $(cat fingerprint.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        run: |
          echo "### EHMS Staff $VNAME ($VCODE) for https://$HOST/staff" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: $APP_ID" >> "$GITHUB_STEP_SUMMARY"
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/debug >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ehms-staff-${{ env.VNAME }}-${{ env.VCODE }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
